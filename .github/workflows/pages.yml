# Publish the CitiCore web app (the static web/ folder) to GitHub Pages on every push to main.
# The database, logins and business rules live in Supabase, so no server is needed.
name: Deploy CitiCore to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Version stamp: every script and the stylesheet get ?v=<commit>, so browsers fetch fresh files after each push
      # (GitHub Pages lets browsers cache for 10 minutes). version.json tells open tabs a newer version is live.
      - name: Stamp version
        run: |
          V="${GITHUB_SHA::8}"
          sed -i -E "s#from '\./([A-Za-z0-9_-]+)\.js'#from './\1.js?v=$V'#g" web/js/*.js
          sed -i -E "s#src=\"js/app\.js\"#src=\"js/app.js?v=$V\"#; s#href=\"css/app\.css\"#href=\"css/app.css?v=$V\"#" web/index.html
          echo "{\"v\":\"$V\"}" > web/version.json
          grep -c "?v=$V" web/index.html web/js/app.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
